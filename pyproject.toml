[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tomcat-web-mcp"
version = "0.1.0"
description = "LangChain agent and session-scoped MCP adapter for TomCat Web"
requires-python = ">=3.11"
dependencies = [
  "tomcat-engine-skills @ git+https://github.com/chnnasn/TomCat_Engine_Skills.git@18edbfe28b81da28cc931507ac2b766d5ce6fbc0",
  "mcp==1.26.0",
  "langchain>=1.2,<1.3",
  "langchain-mcp-adapters>=0.2,<0.3",
  "langchain-openai>=1,<2",
  "httpx>=0.28,<1",
  "starlette>=0.49,<1",
  "uvicorn>=0.35,<1",
  "jsonschema>=4.25,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
tomcat-web-mcp = "tomcat_web_mcp.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
